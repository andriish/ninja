#name: Fortran CI on Fedora (matrix: x86_64 + aarch64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile Fortran on ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: [linux, arm64]
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install gfortran
        run: dnf install -y gcc-gfortran

      - name: Compile and run
        run: |
          gfortran hello.f90 -o hello
          ./hello
